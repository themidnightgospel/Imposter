# Derived from Mapperly's packaging script (https://github.com/riok/mapperly) under the Apache-2.0 license.

name: release

on:
  release:
    types:
      - published

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NUGET_SOURCE: 'https://api.nuget.org/v3/index.json'

concurrency:
  group: ${{ github.workflow }}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ github.event.release.prerelease && 'next' || 'stable' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.extract-version.outputs.RELEASE_VERSION }}
    steps:
      - name: checkout git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: extract-version
        name: extract version
        run: echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: install dependencies
        run: sudo apt update && sudo apt -y install zipmerge # zipmerge is used to merge the multi target nupkg

      - name: build release
        run: bash ./build-scripts/build-and-pack.sh
        env:
          RELEASE_NOTES: ${{ github.event.release.body }}
          RELEASE_VERSION: ${{ steps.extract-version.outputs.RELEASE_VERSION }}

      - name: attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/*.nupkg'

      # Trusted publishing: nuget.org trades the job's GitHub token for an API key that lasts an hour, so it is asked
      # for right before the push.
      - name: sign in to nuget
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: publish nuget
        run: dotnet nuget push './artifacts/*.nupkg' --source "$NUGET_SOURCE" --api-key "$NUGET_API_KEY" --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      - name: add release assets
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" "artifacts/Imposter.${RELEASE_VERSION}.nupkg.intoto.jsonl"
          gh release upload "${{ github.event.release.tag_name }}" artifacts/*.nupkg artifacts/*.intoto.jsonl
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.extract-version.outputs.RELEASE_VERSION }}
  docs:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/docs.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
