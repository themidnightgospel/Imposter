name: CodeQL

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  schedule:
    - cron: '25 7 * * 1'

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: csharp
          queries: security-and-quality

      - name: Build solution
        run: dotnet build Imposter.slnx -c Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:csharp"
          upload: failure-only
          output: sarif-results

      # The build also compiles source-generator output under obj/: the imposters generated for the test and sample
      # projects, and PolySharp's polyfills. Their results would bury the ones in checked-in code, and paths-ignore
      # doesn't apply to a built C# analysis, so they are dropped from the SARIF before upload.
      - name: Drop results in generated output
        run: |
          for sarif in sarif-results/*.sarif; do
            jq '.runs[].results |= map(select(all(.locations[]?; .physicalLocation.artifactLocation.uri | test("(^|/)obj/.*/generated/") | not)))' "$sarif" > "$sarif.filtered"
            mv "$sarif.filtered" "$sarif"
          done

      - name: Upload CodeQL results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif-results
          category: "/language:csharp"
