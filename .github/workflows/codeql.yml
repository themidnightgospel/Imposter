name: CodeQL

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  schedule:
    - cron: '25 7 * * 1'

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp
          queries: security-and-quality

      - name: Build solution
        run: dotnet build Imposter.slnx -c Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:csharp"
          upload: failure-only
          output: sarif-results

      # The build also compiles source-generator output under obj/: the imposters generated for the test and sample
      # projects, and PolySharp's polyfills. Their results would bury the ones in checked-in code, and paths-ignore
      # doesn't apply to a built C# analysis, so they are dropped from the SARIF before upload.
      # Test targets deliberately call virtual members from constructors, and thread helpers catch all worker
      # exceptions to report them on the test thread. Drop those two rules only when all locations are under
      # tests/; retain findings with source or unresolved locations.
      # The two retention tests deliberately force GC to prove that cleared history releases objects.
      # DiagnosticValue deliberately catches arbitrary user ToString failures so diagnostics preserve the
      # original verification failure. Allow only these exact rule/file pairs, with every location resolved;
      # calls to GC elsewhere and other production catch-all clauses remain reported.
      - name: Drop generated output and intentional findings
        run: |
          for sarif in sarif-results/*.sarif; do
            jq '
              .runs[].results |= map(
                select(all(.locations[]?;
                  (.physicalLocation.artifactLocation.uri // "") | test("(^|/)obj/.*/generated/") | not
                ))
                | select(
                  (
                    (.ruleId == "cs/virtual-call-in-constructor" or .ruleId == "cs/catch-of-all-exceptions")
                    and ((.locations // []) | length > 0)
                    and all(.locations[]?;
                      (.physicalLocation.artifactLocation.uri // "") | startswith("tests/")
                    )
                  ) | not
                )
                | select(
                  (
                    ((.locations // []) | length > 0)
                    and (
                      (
                        .ruleId == "cs/call-to-gc"
                        and all(.locations[]?;
                          (.physicalLocation.artifactLocation.uri // "") as $uri
                          | $uri == "tests/Imposter.Abstractions.Tests/InvocationBufferTests.cs"
                            or $uri == "tests/Imposter.Tests/Features/Verification/IndexerHistoryRetentionTests.cs"
                        )
                      )
                      or (
                        .ruleId == "cs/catch-of-all-exceptions"
                        and all(.locations[]?;
                          (.physicalLocation.artifactLocation.uri // "") == "src/Imposter.Abstractions/DiagnosticValue.cs"
                        )
                      )
                    )
                  ) | not
                )
              )
            ' "$sarif" > "$sarif.filtered"
            mv "$sarif.filtered" "$sarif"
          done

      - name: Upload CodeQL results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: sarif-results
          category: "/language:csharp"
