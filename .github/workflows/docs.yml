name: Docs

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Docs version label (defaults to tag or dev)'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r docs/requirements.txt

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy docs with mike (mkdocs at docs/mkdocs.yml)
        env:
          DOCS_VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'dev' }}
        run: |
          mike deploy -F docs/mkdocs.yml --push --remote origin --branch gh-pages --update-aliases ${DOCS_VERSION} latest
          mike set-default -F docs/mkdocs.yml --push --remote origin --branch gh-pages latest
