name: Benchmarks

# Keeps the README's benchmark table current. Every change to master's code reruns the comparison and publishes the
# rendered table to the benchmark-results branch, which the README shows as an image. Pull requests that change the
# benchmark or this pipeline get a short run that publishes nothing. It runs beside Build And Test, not inside it.
on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'benchmarks/Imposter.Benchmarks/**'
      - 'build-scripts/render-benchmark-results.py'
      - '.github/workflows/benchmarks.yml'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Roslyn.Shared.props'
      - 'global.json'
  pull_request:
    branches:
      - master
    paths:
      - 'benchmarks/Imposter.Benchmarks/**'
      - 'build-scripts/render-benchmark-results.py'
      - '.github/workflows/benchmarks.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a run still measuring an older commit.
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Run benchmarks
        env:
          IMPOSTER_BENCHMARK_JOB: ${{ github.event_name == 'pull_request' && 'short' || 'default' }}
        run: >
          dotnet run -c Release --project benchmarks/Imposter.Benchmarks/Imposter.Benchmarks.csproj
          -p:ROSLYN_VERSION=5.0 -- --artifacts "$RUNNER_TEMP/benchmarks"

      - name: Render the results table
        run: >
          python3 build-scripts/render-benchmark-results.py
          --report "$RUNNER_TEMP"/benchmarks/results/*SimpleMethodMockingBenchmarks-report-full.json
          --out "$RUNNER_TEMP/benchmark-results"
          --commit "$GITHUB_SHA"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Keep the raw report beside the table
        run: cp "$RUNNER_TEMP"/benchmarks/results/*SimpleMethodMockingBenchmarks-report-full.json "$RUNNER_TEMP/benchmark-results/simple-method.json"

      - name: Upload the results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: ${{ runner.temp }}/benchmark-results
          if-no-files-found: error

  publish:
    name: Publish to the benchmark-results branch
    needs: benchmark
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmark-results
          path: benchmark-results

      # The branch holds only the latest results, so each run replaces its single commit.
      - name: Push the results
        working-directory: benchmark-results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "Generated by the Benchmarks workflow (.github/workflows/benchmarks.yml) for every change to master." \
            "The README shows simple-method.svg. Don't edit this branch: each run replaces it." > README.md
          git init -q -b benchmark-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Benchmark results for $GITHUB_SHA"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" benchmark-results
